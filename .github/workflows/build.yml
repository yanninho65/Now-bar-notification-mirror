name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Sans ce `packages:`, l'action essaie par défaut d'installer le
          # paquet legacy "tools" (Android SDK Tools) en plus de
          # platform-tools — Google a retiré "tools" du dépôt SDK, donc
          # sdkmanager échoue systématiquement avec "Failed to find package
          # 'tools'" (cassé pour tout le monde depuis ce retrait, pas lié à
          # ce dépôt). platform-tools seul suffit : les autres composants
          # requis (platforms;android-36, build-tools, cmdline-tools) sont
          # déjà fournis par l'image du runner ou téléchargés automatiquement
          # par Gradle/AGP pendant le build, les licences étant déjà
          # acceptées par cette même action.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Restore debug keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/keystore/debug.keystore"

      - name: Build debug APKs (app + wear)
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/keystore/debug.keystore
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: NowBarMirror-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: NowBarMirror-wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
